# Docker Compose override for k3d development
version: '3.8'

services:
  vnidcard-app:
    build: .
    image: vnidcard-app:latest
    ports:
      - "8501:8501"
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - vnidcard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  vnidcard-net:
    external: true
    name: k3d-vnidcard-cluster
