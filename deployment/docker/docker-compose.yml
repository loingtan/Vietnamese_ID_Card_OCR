
services: 
  vnid-api:
    build: 
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: vnidcard-api
    ports:
      - "8080:8080"  # API
      - "8000:8000"  # Metrics
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - METRICS_PORT=8000
      - LOG_LEVEL=INFO
      - ENABLE_STREAMLIT=false
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=vnid_card_ocr
    volumes:
      - ../../logs:/app/logs
      - ../../data/models:/app/data/models
      - ../../data/uploads:/app/data/uploads
      - ../../data/outputs:/app/data/outputs
      - ../../config/.env:/app/config/.env:ro

    networks:
      - vnidcard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    depends_on:
      - mongodb

  # Database
  mongodb:
    image: mongo:7
    container_name: vnidcard-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=vnid_card_ocr
    volumes:
      - mongodb_data:/data/db
      - ../../logs:/var/log/mongodb
    networks:
      - vnidcard-network
    restart: unless-stopped

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vnidcard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../../monitor/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Grafana - Visualization Dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: vnidcard-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../monitor/grafana/provisioning:/etc/grafana/provisioning
      - ../../monitor/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=vnidcard123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Alertmanager - Alert Handling
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: vnidcard-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../monitor/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--cluster.listen-address='
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]
    depends_on:
      - prometheus

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.0
    container_name: vnidcard-loki
    ports:
      - "3100:3100"
    volumes:
      - ../../monitor/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Fluent Bit - Log Collection
  fluent-bit:
    image: fluent/fluent-bit:2.2.0
    container_name: vnidcard-fluent-bit
    volumes:
      - ../../monitor/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ../../monitor/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - ../../logs:/app/logs:ro 
      - /var/log:/host/var/log:ro  
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: vnidcard-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    container_name: vnidcard-cadvisor
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["monitoring"]

  # GPU Metrics (NVIDIA GPU support)
  nvidia-gpu-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:0.1
    container_name: vnidcard-gpu-exporter
    ports:
      - "9445:9445"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - vnidcard-network
    restart: unless-stopped
    profiles: ["gpu", "monitoring"]

volumes:
  mongodb_data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:

networks:
  vnidcard-network:
    driver: bridge
