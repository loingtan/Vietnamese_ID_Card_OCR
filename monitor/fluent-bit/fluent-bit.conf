[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

# Vietnamese ID Card API Application Logs
[INPUT]
    Name              tail
    Path              /var/log/vnidcard/*.log
    Path_Key          file
    Parser            json
    Tag               vnidcard.app
    Refresh_Interval  5
    Read_from_Head    true

# Vietnamese ID Card API Stdout/Stderr
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          container_log
    Parser            docker
    Tag               vnidcard.container
    Refresh_Interval  5
    Read_from_Head    true

# System Logs (syslog)
[INPUT]
    Name              systemd
    Tag               vnidcard.syslog
    Systemd_Filter    _SYSTEMD_UNIT=docker.service
    Strip_Underscores On
    Read_From_Tail    On

[INPUT]
    Name              tail
    Path              /var/log/syslog
    Path_Key          syslog_file
    Parser            syslog-rfc3164
    Tag               vnidcard.syslog
    Refresh_Interval  5

# System performance metrics
[INPUT]
    Name              cpu
    Tag               vnidcard.metrics.cpu
    Interval_Sec      10

[INPUT]
    Name              mem
    Tag               vnidcard.metrics.memory
    Interval_Sec      10

[INPUT]
    Name              disk
    Tag               vnidcard.metrics.disk
    Interval_Sec      30

[INPUT]
    Name              netif
    Tag               vnidcard.metrics.network
    Interval_Sec      10

# Custom API metrics logs
[INPUT]
    Name              tail
    Path              /var/log/vnidcard/api.log
    Path_Key          api_log
    Parser            api_custom
    Tag               vnidcard.api
    Refresh_Interval  1
    Read_from_Head    true

# Error logs
[INPUT]
    Name              tail
    Path              /var/log/vnidcard/error.log
    Path_Key          error_log
    Parser            json
    Tag               vnidcard.error
    Refresh_Interval  1
    Read_from_Head    true

# Model inference logs
[INPUT]
    Name              tail
    Path              /var/log/vnidcard/model.log
    Path_Key          model_log
    Parser            model_inference
    Tag               vnidcard.model
    Refresh_Interval  5
    Read_from_Head    true

# FILTERS
# Add metadata for all logs
[FILTER]
    Name                modify
    Match               vnidcard.*
    Add                 service Vietnamese_ID_Card_OCR
    Add                 environment production
    Add                 version 1.0.0

# Parse container logs to extract JSON if possible
[FILTER]
    Name                parser
    Match               vnidcard.container
    Key_Name            log
    Parser              container_json
    Reserve_Data        On

# Extract error information
[FILTER]
    Name                grep
    Match               vnidcard.error
    Regex               level (ERROR|CRITICAL|FATAL)

# Filter high confidence predictions
[FILTER]
    Name                lua
    Match               vnidcard.model
    Script              /fluent-bit/etc/scripts/confidence_filter.lua
    Call                filter_low_confidence

# Rate limiting for verbose logs
[FILTER]
    Name                throttle
    Match               vnidcard.app
    Rate                1000
    Window              300
    Interval            1s

# OUTPUTS
# Send to Loki
[OUTPUT]
    Name                loki
    Match               vnidcard.*
    Host                loki
    Port                3100
    Labels              job=fluent-bit, service=$service, environment=$environment
    Auto_Kubernetes_Labels on
    Label_keys          $level,$service,$environment,$container_name

# Send critical errors to alerting system
[OUTPUT]
    Name                http
    Match               vnidcard.error
    Host                alertmanager
    Port                9093
    URI                 /api/v1/alerts
    Format              json
    Header              Content-Type application/json

# Debug output (comment out in production)
[OUTPUT]
    Name                stdout
    Match               vnidcard.debug
    Format              json_lines
